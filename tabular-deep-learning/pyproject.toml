[project]
name = "tabular-deep-learning"
version = "0.1.0"
description = "Does tabular deep learning actually beat boosting?"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "torch>=2.5",
    "pytorch-tabnet==4.1.0",
    "rtdl-revisiting-models>=0.0.2",
    "rtdl-num-embeddings>=0.0.12",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
