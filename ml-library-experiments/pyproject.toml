[project]
name = "ml-library-experiments"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "optuna>=4.0",
    "shap>=0.46",
    "imbalanced-learn>=0.13",
    "torch>=2.5",
    "transformers>=4.46",
    "sentence-transformers>=3.2",
    "datasets>=3.1",
    "numpyro>=0.16",
    "jax>=0.4",
    "statsmodels>=0.14",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]


